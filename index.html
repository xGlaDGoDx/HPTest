<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, user-scalable=no' />
    <title>HelpCoin</title>
    <script type="text/javascript" src="pako_inflate.min.js"></script>
    <style type="text/css">
        html {
            position: relative;
            min-height: 100%;
        }

        body {
            height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            overflow: hidden;
        }

        #logo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #logo {
            width: 500px;
            height: 500px;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div id="logo-container">
        <img id="logo" src="logo.png" alt="Logo">
    </div>
    <canvas id="canvas"></canvas>
    <script src="index.js"></script>
    <script>
        const enginedata = "index";
        const gamedata = "index.pck";
        const engine = new Engine();
        async function loadAndInit() {
            try {
                Promise.all([
                    engine.preloadFile(gamedata),
                    engine.init(enginedata)
                ]).then(() => {
                    return engine.start({ args: ['--main-pack', gamedata], focusCanvas: true });
                }).then(() => {
                    document.getElementById('logo-container').style.display = 'none';
                    console.log("Godot Engine has started!")
                });
            } catch (error) {
                console.error(error);
            }
        }
        loadAndInit();
    </script>
</body>

</html>
